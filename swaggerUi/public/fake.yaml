openapi: 3.0.0
info:
  title: JSONPlaceholder API
  version: 1.0.0
  description: A fake REST API for testing applications.
servers:
  - url: https://jsonplaceholder.typicode.com

components:
  schemas:
    Post:
      type: object
      properties:
        userId:
          type: integer
          example: 1
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "sunt aut facere repellat provident occaecati excepturi optio reprehenderit"
        body:
          type: string
          example: "quia et suscipit\nsuscipit recusandae consequuntur expedita et cum\nreprehenderit molestiae ut ut quas totam\nnostrum rerum est autem sunt rem eveniet architecto"

    Comment:
      type: object
      properties:
        postId:
          type: integer
          example: 1
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "id labore ex et quam laborum"
        email:
          type: string
          example: "Eliseo@gardner.biz"
        body:
          type: string
          example: "laudantium enim quasi est quidem magnam voluptate ipsam eos"

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Leanne Graham"
        username:
          type: string
          example: "Bret"
        email:
          type: string
          example: "Sincere@april.biz"
        address:
          type: object
          properties:
            street:
              type: string
              example: "Kulas Light"
            suite:
              type: string
              example: "Apt. 556"
            city:
              type: string
              example: "Gwenborough"
            zipcode:
              type: string
              example: "92998-3874"
            geo:
              type: object
              properties:
                lat:
                  type: string
                  example: "-37.3159"
                lng:
                  type: string
                  example: "81.1496"
        phone:
          type: string
          example: "1-770-736-8031 x56442"
        website:
          type: string
          example: "hildegard.org"
        company:
          type: object
          properties:
            name:
              type: string
              example: "Romaguera-Crona"
            catchPhrase:
              type: string
              example: "Multi-layered client-server neural-net"
            bs:
              type: string
              example: "harness real-time e-markets"

    Album:
      type: object
      properties:
        userId:
          type: integer
          example: 1
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "quidem molestiae enim"

    Photo:
      type: object
      properties:
        albumId:
          type: integer
          example: 1
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "accusamus beatae ad facilis cum similique qui sunt"
        url:
          type: string
          format: uri
          example: "https://via.placeholder.com/600/92c952"
        thumbnailUrl:
          type: string
          format: uri
          example: "https://via.placeholder.com/150/92c952"

    Todo:
      type: object
      properties:
        userId:
          type: integer
          example: 1
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "delectus aut autem"
        completed:
          type: boolean
          example: false

paths:
  /posts:
    get:
      summary: Get all posts
      tags:
        - Posts
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      summary: Get a single post by ID
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Single post object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /comments:
    get:
      summary: Get all comments
      tags:
        - Comments
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

  /comments/{id}:
    get:
      summary: Get a single comment by ID
      tags:
