  /photos:
    get:
      summary: Get all photos
      tags:
        - Photos
      responses:
        "200":
          description: List of photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"

  /photos/{id}:
    get:
      summary: Get a single photo by ID
      tags:
        - Photos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Single photo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"

  /todos:
    get:
      summary: Get all todos
      tags:
        - Todos
      responses:
        "200":
          description: List of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"

  /todos/{id}:
    get:
      summary: Get a single todo by ID
      tags:
        - Todos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Single todo object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
