  /albums:
    get:
      summary: Get all albums
      tags:
        - Albums
      responses:
        "200":
          description: List of albums
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Album"

  /albums/{id}:
    get:
      summary: Get a single album by ID
      tags:
        - Albums
      parameters:
        - name: id
          in: path
          required: true
          schema:
