<!-- EXTERNAL 🔥 -->
<!-- NO CORS ENABLE -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Swagger UI for My API" />
    <title>My API Docs</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      header {
        background-color: #4a90e2;
        color: white;
        padding: 1rem;
        text-align: center;
        font-size: 1.5rem;
      }

      #swagger-ui {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <script
      src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"
      crossorigin
    ></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          urls: [
            { url: "./store.yaml", name: "Fake Store API" },
            { url: "./fake.yaml", name: "JSON Placeholder API " },
            { url: "./no-cors.yaml", name: "NO CORS API " },
            { url: "http://localhost:8080/blocked", name: "HTTP-bin  API " },
          ],
          dom_id: "#swagger-ui",
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout",
        });
      };
    </script>
  </body>
</html>
